name: Deploy Mopick site

# invest/ 폴더(모픽 앱)를 모픽 전용 저장소 geniusbyun-kaka/mopick 의 main 으로 복사합니다.
# 그 저장소의 GitHub Pages 가 https://mopickapp.com 으로 서비스됩니다.
# 따로 나눈 이유 (2026-11-26): 이 저장소 맨 위에는 새근새근(아기 수면 일기)이 있고 기록을 브라우저에만
# 저장하므로, 이 저장소에 도메인을 연결하면 주소가 바뀌어 기록이 사라진다. 모픽만 따로 내보낸다.
#
# 필요한 저장소 Secret:
#   MOPICK_DEPLOY_TOKEN   mopick 저장소에 Contents 쓰기 권한이 있는 fine-grained 토큰
# 토큰은 만료일이 있습니다. 만료되면 이 작업이 실패하니 새로 발급해 Secret 을 바꿔 주세요.
on:
  push:
    branches: [main]
    paths:
      - "invest/**"
      - ".github/workflows/deploy-mopick.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mopick
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Copy invest/ to the mopick repository
        env:
          TOKEN: ${{ secrets.MOPICK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::MOPICK_DEPLOY_TOKEN 이 없습니다. Settings → Secrets and variables → Actions 에 추가해 주세요."
            exit 1
          fi
          mkdir site
          cp -R invest/. site/
          echo "mopickapp.com" > site/CNAME   # GitHub Pages 맞춤 도메인
          touch site/.nojekyll                # .well-known 같은 점(.) 폴더도 그대로 서비스
          cd site
          git init -q -b main
          git config user.name "mopick-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/geniusbyun-kaka/mopick.git" main
