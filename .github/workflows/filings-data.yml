name: Berkshire 13F snapshot

# 매일 오전 6시 15분(KST = 21:15 UTC) 투자 대가 8인(버핏·애크먼·클라르만·러브·아인혼·리 루·
# 매클레모어·퍼스트 이글)의 13F-HR 보고서와 분기 사이 매매 공시(Form 4 · 13D/G → events.json)를
# SEC EDGAR 에서 받아 `filings` 브랜치에 저장합니다.
# 주간(월요일)에서 매일로 바꾼 이유 (2026-10-08): Form 4 는 매매 후 2영업일 안에 나오는데 주간 수집은
# 최근 매수가 반영이 최장 일주일 늦어진다 (버크셔 레너 9월 말 매수 사례). 이미 읽은 13F·공시는
# 이전 스냅샷 캐시를 재사용하므로 매일 돌려도 EDGAR 요청은 새 공시 몇 건 분량뿐이다.
# 13F 자체는 분기 종료 45일 뒤(2월·5월·8월·11월 중순)에만 새로 나온다.
on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filings-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 첫 실행은 새 투자자들의 CUSIP → 티커 조회(OpenFIGI 속도 제한)가 오래 걸린다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore previous snapshot (already-read filings are reused)
        run: |
          git clone -q --depth 1 --branch filings "https://github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null || mkdir -p out
          rm -rf out/.git

      - name: Fetch 13F filings
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: node scripts/fetch-filings.mjs out

      - name: Publish to filings branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b filings
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "13F snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" filings
