name: Stock history snapshot

# 하루 한 번(미국 장 마감 후) S&P 500 전 종목과 주요 ETF 의 일봉·5분봉을 받아 `stocks` 브랜치에 저장합니다.
# 앱의 종목·비교 탭이 raw.githubusercontent.com 의 `stocks` 브랜치 파일을 읽습니다.
on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore previous snapshot (failed tickers keep their last file)
        run: |
          git clone -q --depth 1 --branch stocks "https://github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null || mkdir -p out
          rm -rf out/.git

      - name: Fetch stocks and ETFs
        run: node scripts/fetch-stocks.mjs out

      - name: Publish to stocks branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b stocks
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Stock history snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stocks
