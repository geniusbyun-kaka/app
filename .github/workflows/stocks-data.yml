name: Stock history snapshot

# 하루 한 번(미국 장 마감 후) S&P 500 전 종목과 주요 ETF 의 일봉·5분봉을 받아 `stocks` 브랜치에 저장합니다.
# 앱의 종목·비교 탭이 raw.githubusercontent.com 의 `stocks` 브랜치 파일을 읽습니다.
# 시작 21:20 UTC = 06:20 KST: 뉴욕 장 마감(서머타임 20:00 · 겨울 21:00 UTC) 직후이며,
# 07:30 KST(22:30 UTC) 푸시 알림이 이날 종가 스냅샷을 쓸 수 있도록 그보다 먼저 끝나야 합니다.
on:
  schedule:
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore previous snapshot (failed tickers keep their last file)
        run: |
          git clone -q --depth 1 --branch stocks "https://github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null || mkdir -p out
          rm -rf out/.git

      - name: Fetch stocks and ETFs
        run: node scripts/fetch-stocks.mjs out

      # 배당 퀄리티: 미국 배당주의 EPS 를 SEC 에서 받아 배당성향·커버리지 계산 (실패해도 시세 스냅샷은 올린다)
      - name: Compute dividend quality (SEC EPS)
        continue-on-error: true
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: node scripts/fetch-div-quality.mjs out

      - name: Publish to stocks branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b stocks
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Stock history snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stocks
