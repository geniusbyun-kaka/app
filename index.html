<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새근새근</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F7F4ED; --surface:#FFFFFF; --surface2:#F1EDE3;
  --ink:#2E2B3F; --muted:#8B8699; --line:#E5E0D4;
  --night:#565CA8; --night-soft:#E4E5F5;
  --nap:#D08A2E; --nap-soft:#F6E8D2;
  --good:#3E8E63; --good-soft:#DFEEE6;
  --diaper:#9A7B5C; --diaper-soft:#EFE4D6;
  --warn:#B7791F; --warn-soft:#F5EAD3;
  --bad:#BF5B5B; --bad-soft:#F5E0E0;
  --band:rgba(86,92,168,.10);
  --scrim:rgba(30,28,45,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B26; --surface:#262433; --surface2:#2E2B3D;
    --ink:#EAE7F2; --muted:#9C97AC; --line:#3A374C;
    --night:#8B90D9; --night-soft:#343759;
    --nap:#E0A45C; --nap-soft:#463A26;
    --good:#6FBF92; --good-soft:#27402F;
    --diaper:#C4A484; --diaper-soft:#3F3428;
    --warn:#D9A250; --warn-soft:#443722;
    --bad:#D98080; --bad-soft:#442A2A;
    --band:rgba(139,144,217,.14);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1B26; --surface:#262433; --surface2:#2E2B3D;
  --ink:#EAE7F2; --muted:#9C97AC; --line:#3A374C;
  --night:#8B90D9; --night-soft:#343759;
  --nap:#E0A45C; --nap-soft:#463A26;
  --good:#6FBF92; --good-soft:#27402F;
  --diaper:#C4A484; --diaper-soft:#3F3428;
  --warn:#D9A250; --warn-soft:#443722;
  --bad:#D98080; --bad-soft:#442A2A;
  --band:rgba(139,144,217,.14);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.55; margin:0; padding:0 16px 48px;
}
.wrap{max-width:600px; margin:0 auto}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:26px 2px 14px}
h1{font-family:"Gowun Dodum",sans-serif; font-weight:400; font-size:1.8rem; margin:0; letter-spacing:.02em}
.sub{color:var(--muted); font-size:.88rem; margin:2px 0 0}
.age-chip{background:var(--night-soft); color:var(--night); border-radius:999px; padding:6px 13px; font-weight:700; font-size:.85rem; white-space:nowrap}
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:16px}
.tabs button{
  border:0; background:none; color:var(--muted); font:inherit; font-weight:500;
  padding:10px 0; border-radius:9px; cursor:pointer;
}
.tabs button:focus-visible{outline:2px solid var(--night); outline-offset:1px}
.tabs button.on{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
.card h2{font-family:"Gowun Dodum",sans-serif; font-weight:400; font-size:1.1rem; margin:0 0 12px}
.card h2 small{color:var(--muted); font-family:"IBM Plex Sans KR",sans-serif; font-size:.8rem; margin-left:6px}
/* 마지막 상태 밴드 */
.statusband{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 8px; margin-bottom:14px; text-align:center}
.stile .sk{font-size:.76rem; color:var(--muted)}
.stile .sv{font-weight:700; font-size:.95rem; margin:2px 0; font-variant-numeric:tabular-nums; line-height:1.3}
.stile.sleep .sv{color:var(--night)} .stile.meal .sv{color:var(--good)} .stile.diaper .sv{color:var(--diaper)}
.stile .ss{font-size:.72rem; color:var(--muted)}
/* 빠른 기록 버튼 */
.quick{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px}
.qbtn{border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; font:inherit; color:var(--ink); padding:4px 0; border-radius:12px}
.qbtn:focus-visible{outline:2px solid var(--night); outline-offset:2px}
.qbtn .circ{width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; box-shadow:0 2px 6px rgba(0,0,0,.08)}
.qbtn span{font-size:.82rem; font-weight:500}
.circ.nap{background:var(--nap-soft)} .circ.night{background:var(--night-soft)}
.circ.meal{background:var(--good-soft)} .circ.diaper{background:var(--diaper-soft)}
/* 바텀시트 */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.sheet{background:var(--surface); width:100%; max-width:600px; border-radius:18px 18px 0 0; padding:20px 18px 26px; box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.sheet h3{font-family:"Gowun Dodum",sans-serif; font-weight:400; font-size:1.15rem; margin:0 0 14px; display:flex; align-items:center; gap:8px}
/* form */
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--surface2); border-radius:10px; padding:4px; margin-bottom:12px}
.seg button{border:0; background:none; color:var(--muted); font:inherit; font-weight:500; padding:9px 0; border-radius:7px; cursor:pointer}
.seg button.on{background:var(--diaper-soft); color:var(--diaper); font-weight:700}
.frow{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.frow label{flex:1; min-width:110px; font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:4px}
input[type=date],input[type=time],input[type=text]{
  font:inherit; color:var(--ink); background:var(--surface2); border:1px solid var(--line);
  border-radius:8px; padding:10px; width:100%; min-height:44px;
}
.btn{
  display:block; width:100%; border:0; border-radius:10px; padding:13px 0; font:inherit;
  font-weight:700; cursor:pointer; background:var(--night); color:#fff;
}
:root[data-theme="dark"] .btn{color:#1C1B26}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#1C1B26} }
.btn.ghost{background:var(--surface2); color:var(--ink); font-weight:500}
.btnrow{display:flex; gap:8px}
.btnrow .btn{flex:1}
.note{font-size:.82rem; color:var(--muted); margin:8px 0 0}
/* gauges */
.gauge{margin-bottom:16px}
.gauge:last-child{margin-bottom:2px}
.ghead{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.ghead .name{font-weight:700}
.ghead .val{margin-left:auto; font-variant-numeric:tabular-nums}
.chip{font-size:.74rem; font-weight:700; border-radius:999px; padding:2px 9px}
.chip.ok{background:var(--good-soft); color:var(--good)}
.chip.low{background:var(--warn-soft); color:var(--warn)}
.chip.high{background:var(--bad-soft); color:var(--bad)}
.chip.none{background:var(--surface2); color:var(--muted)}
.track{position:relative; height:12px; border-radius:999px; background:var(--surface2); overflow:hidden}
.track .band{position:absolute; top:0; bottom:0; background:var(--band); border-left:1px dashed var(--night); border-right:1px dashed var(--night)}
.track .fill{position:absolute; top:2px; bottom:2px; left:2px; border-radius:999px; min-width:2px}
.gnote{font-size:.76rem; color:var(--muted); margin-top:4px}
/* 타임라인 */
.dayhead{display:flex; align-items:center; gap:8px; background:var(--surface2); border-radius:10px; padding:9px 12px; margin:14px 0 4px; font-size:.88rem}
.dayhead:first-child{margin-top:0}
.dayhead .d{font-weight:700}
.dayhead .today-mark{font-size:.72rem; font-weight:700; color:var(--night); background:var(--night-soft); border-radius:999px; padding:1px 8px}
.dayhead .sum{margin-left:auto; color:var(--muted); font-size:.8rem; font-variant-numeric:tabular-nums; display:flex; gap:10px}
.entry{display:flex; align-items:center; gap:10px; padding:11px 4px; border-top:1px solid var(--line)}
.dayhead + .entry{border-top:0}
.entry .etime{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.86rem; width:44px; flex:none}
.dot{width:9px; height:9px; border-radius:50%; flex:none}
.dot.nap{background:var(--nap)} .dot.night{background:var(--night)}
.dot.meal{background:var(--good)} .dot.diaper{background:var(--diaper)}
.entry .lab{font-weight:500}
.entry .t{font-variant-numeric:tabular-nums; color:var(--muted); font-size:.86rem}
.entry .del{border:0; background:none; color:var(--muted); cursor:pointer; font-size:1rem; padding:4px 8px; border-radius:6px; margin-left:auto}
.entry .del:hover{color:var(--bad); background:var(--bad-soft)}
.empty{color:var(--muted); text-align:center; padding:18px 8px; font-size:.92rem}
/* stats + insights */
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:4px}
.stat{background:var(--surface2); border-radius:10px; padding:10px 12px}
.stat .k{font-size:.74rem; color:var(--muted)}
.stat .v{font-weight:700; font-variant-numeric:tabular-nums; font-size:.95rem}
.stat .r{font-size:.72rem; color:var(--muted)}
.insight{display:flex; gap:9px; padding:10px 0; border-top:1px solid var(--line); font-size:.92rem}
.insight:first-of-type{border-top:0}
.insight .mark{flex:none; width:8px; height:8px; border-radius:50%; margin-top:8px}
.insight.ok .mark{background:var(--good)} .insight.low .mark{background:var(--warn)}
.insight.high .mark{background:var(--bad)} .insight.info .mark{background:var(--night)}
.chartbox{overflow-x:auto}
svg{display:block; width:100%; height:auto}
.legend{display:flex; gap:16px; font-size:.8rem; color:var(--muted); margin-top:6px}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
/* guide table */
table{border-collapse:collapse; width:100%; font-size:.86rem}
th,td{padding:8px; text-align:left; border-top:1px solid var(--line); font-variant-numeric:tabular-nums}
th{color:var(--muted); font-size:.76rem; font-weight:500; border-top:0}
tr.me td{background:var(--night-soft); font-weight:700}
tr.me td:first-child{border-radius:8px 0 0 8px} tr.me td:last-child{border-radius:0 8px 8px 0}
ul.tips{margin:0; padding-left:18px}
ul.tips li{margin-bottom:8px}
.savedmode{font-size:.78rem; color:var(--muted); text-align:center; margin-top:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>새근새근</h1><p class="sub" id="subTitle">아기 수면 일기</p></div>
    <div class="age-chip" id="ageChip">👶</div>
  </header>
  <nav class="tabs" id="tabs" aria-label="화면 선택">
    <button data-tab="today">오늘</button>
    <button data-tab="week">주간</button>
    <button data-tab="month">월간</button>
    <button data-tab="guide">가이드</button>
  </nav>
  <main id="view"></main>
  <p class="savedmode" id="modeNote"></p>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
/* ---------- 권장 수면 가이드 (개월수별, 시간 단위) ---------- */
const GUIDES = [
  {min:4,  max:11, label:"4~11개월",  total:[12,16], night:[9,11],    nap:[2,4.5],  naps:"2~3회", bed:"19:00~20:00"},
  {min:12, max:17, label:"12~17개월", total:[11,14], night:[10,11],   nap:[1.5,2.5],naps:"1~2회", bed:"19:30~20:30"},
  {min:18, max:23, label:"18~23개월", total:[11,14], night:[10,11.5], nap:[1,2],    naps:"1회",   bed:"19:30~20:30"},
  {min:24, max:35, label:"24~35개월", total:[11,14], night:[10.5,11.5],nap:[1,1.5], naps:"1회",   bed:"20:00~20:30"},
];
const SCALE_MAX = 16*60; // 게이지·차트 세로축 상한(분)
const TYPE_META = {
  nap:   {label:"낮잠",   emoji:"☀️", dot:"nap"},
  night: {label:"밤잠",   emoji:"🌙", dot:"night"},
  meal:  {label:"이유식", emoji:"🍚", dot:"meal"},
  diaper:{label:"기저귀", emoji:"🧷", dot:"diaper"},
};

const LS_KEY = "saegeun_v1";
const state = { tab:"today", entries:[], birthDate:null, babyName:null, db:null, mode:"local", sheet:null, diaperKind:"pee" };

/* ---------- 날짜/시간 유틸 ---------- */
const pad = n => String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dayKey(new Date());
const nowHM = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hm2min = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const fmtDur = min => {
  const v=Math.round(min), h=Math.floor(v/60), m=v%60;
  return h? (m? `${h}시간 ${m}분` : `${h}시간`) : `${m}분`;
};
const fmtRange = r => `${r[0]}~${r[1]}시간`;
const fmtClock = min => { const v=((Math.round(min)%1440)+1440)%1440; return `${pad(Math.floor(v/60))}:${pad(v%60)}`; };
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const weekdayKo = ["일","월","화","수","목","금","토"];
function fmtSince(ts){
  const diff = Math.max(0, Date.now()-ts);
  const m = Math.floor(diff/60000);
  if(m<1) return "방금 전";
  const h = Math.floor(m/60);
  return h? `${h}시간 ${m%60}분 전` : `${m}분 전`;
}
function fmtDayHead(dateStr){
  const d = new Date(dateStr+"T00:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayKo[d.getDay()]})`;
}
function ageMonths(){
  const b = new Date((state.birthDate||defaultBirth())+"T00:00");
  const t = new Date();
  let m = (t.getFullYear()-b.getFullYear())*12 + t.getMonth()-b.getMonth();
  if (t.getDate() < b.getDate()) m--;
  return Math.max(0,m);
}
function defaultBirth(){ // 미설정 시 16개월로 가정
  const d = new Date(); d.setMonth(d.getMonth()-16);
  return dayKey(d);
}
const guideFor = m => GUIDES.find(g=>m>=g.min&&m<=g.max) || GUIDES[GUIDES.length-1];

/* ---------- 저장소 (artifact db ↔ localStorage) ---------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    state.entries = Object.entries(d.sleeps||{}).map(([id,e])=>({id,...e}));
    state.birthDate = d.birthDate||null;
    state.babyName = d.babyName||null;
  }catch(e){}
}
function persistLocal(){
  try{
    const sleeps={}; state.entries.forEach(e=>{ const {id,...rest}=e; sleeps[id]=rest; });
    localStorage.setItem(LS_KEY, JSON.stringify({sleeps, birthDate:state.birthDate, babyName:state.babyName}));
  }catch(e){}
}
function connectDb(){
  if(!(window.claude && typeof window.claude.use==="function")) return;
  window.claude.use("db").then(db=>{
    if(!db) return;
    state.db = db;
    db.doc("settings/profile").onSnapshot(s=>{
      if(s.exists){
        const d=s.data();
        if(d.birthDate) state.birthDate = d.birthDate;
        state.babyName = d.babyName||state.babyName;
        render();
      }
    }, ()=>{});
    db.collection("sleeps").onSnapshot(qs=>{
      state.entries = qs.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
      state.mode = "db";
      render();
    }, ()=>{ state.db=null; });
  }).catch(()=>{});
}
function saveEntry(e){
  const id = "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(state.db){ state.db.collection("sleeps").doc(id).set(e).catch(()=>alert("저장하지 못했어요. 잠시 후 다시 시도해 주세요.")); }
  else { state.entries.push({id,...e}); persistLocal(); }
  closeSheet();
  render();
}
function removeEntry(id){
  if(state.db){ state.db.collection("sleeps").doc(id).delete().catch(()=>{}); }
  else { state.entries = state.entries.filter(e=>e.id!==id); persistLocal(); render(); }
}
function saveProfile(birth, name){
  state.birthDate = birth||state.birthDate;
  state.babyName = (name||"").trim()||null;
  if(state.db){ state.db.doc("settings/profile").set({birthDate:state.birthDate, babyName:state.babyName}).catch(()=>{}); }
  else persistLocal();
  render();
}
/* ---------- 백업 (로컬 모드용) ---------- */
function exportData(){
  const sleeps={}; state.entries.forEach(e=>{ const {id,...rest}=e; sleeps[id]=rest; });
  const blob = new Blob([JSON.stringify({sleeps, birthDate:state.birthDate, babyName:state.babyName}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `saegeun-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      const incoming = Object.entries(d.sleeps||{}).map(([id,e])=>({id,...e}));
      const have = new Set(state.entries.map(e=>e.id));
      incoming.forEach(e=>{ if(!have.has(e.id)) state.entries.push(e); });
      if(d.birthDate && !state.birthDate) state.birthDate = d.birthDate;
      if(d.babyName && !state.babyName) state.babyName = d.babyName;
      persistLocal(); render();
      alert(`백업을 불러왔어요. 현재 총 ${state.entries.length}건의 기록이 있어요.`);
    }catch(e){ alert("백업 파일을 읽지 못했어요. 새근새근에서 내보낸 JSON 파일인지 확인해 주세요."); }
  };
  r.readAsText(file);
}

/* ---------- 집계 (이유식·기저귀는 수면 통계에서 제외) ---------- */
function dayStats(dateStr){
  const es = state.entries.filter(e=>e.date===dateStr);
  const nap = es.filter(e=>e.type==="nap").reduce((a,e)=>a+e.minutes,0);
  const night = es.filter(e=>e.type==="night").reduce((a,e)=>a+e.minutes,0);
  return {date:dateStr, nap, night, total:nap+night, entries:es};
}
function lastDays(n){
  const out=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const c=new Date(d); c.setDate(d.getDate()-i); out.push(dayStats(dayKey(c))); }
  return out;
}
function statusFor(min,rangeH){
  if(min<=0) return {label:"기록 없음", cls:"none"};
  const h=min/60;
  if(h<rangeH[0]) return {label:"부족", cls:"low"};
  if(h>rangeH[1]) return {label:"과다", cls:"high"};
  return {label:"적정", cls:"ok"};
}
/* 마지막 상태: 잠(깬 시각 기준), 이유식, 기저귀 */
function entryStartTs(e){ return new Date(e.date+"T"+e.start).getTime(); }
function sleepEndTs(e){
  let ts = new Date(e.date+"T"+e.end).getTime();
  if(hm2min(e.end)<=hm2min(e.start)) ts += 86400000; // 자정 넘김
  return ts;
}
function lastStatus(){
  const now = Date.now();
  let sleep=null, meal=null, diaper=null;
  state.entries.forEach(e=>{
    if(e.type==="nap"||e.type==="night"){
      const ts=sleepEndTs(e); if(ts<=now && (!sleep||ts>sleep)) sleep=ts;
    } else if(e.type==="meal"){
      const ts=entryStartTs(e); if(ts<=now && (!meal||ts>meal)) meal=ts;
    } else if(e.type==="diaper"){
      const ts=entryStartTs(e); if(ts<=now && (!diaper||ts>diaper.ts)) diaper={ts, kind:e.kind};
    }
  });
  return {sleep, meal, diaper};
}
// 밤잠 시작 시각(자정 이전은 그대로, 새벽 시작은 +24h 해서 평균/편차 계산)
function nightStarts(days){
  const arr=[];
  days.forEach(d=>d.entries.filter(e=>e.type==="night").forEach(e=>{
    let m=hm2min(e.start); if(m<12*60) m+=1440; arr.push(m);
  }));
  return arr;
}
function mean(a){ return a.reduce((x,y)=>x+y,0)/a.length; }
function stddev(a){ const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)*(x-m)))); }

/* ---------- 인사이트 문구 ---------- */
function analyze(days, guide){
  const rec = days.filter(d=>d.total>0);
  const out = [];
  if(rec.length===0) return out;
  const avgT=mean(rec.map(d=>d.total)), avgN=mean(rec.map(d=>d.night)), avgP=mean(rec.map(d=>d.nap));
  const st = statusFor(avgT, guide.total);
  if(st.cls==="ok") out.push({cls:"ok", text:`평균 총 수면 ${fmtDur(avgT)}으로 권장 범위(${fmtRange(guide.total)}) 안에 있어요. 잘 자고 있어요!`});
  else if(st.cls==="low") out.push({cls:"low", text:`평균 총 수면이 ${fmtDur(avgT)}으로 권장(${fmtRange(guide.total)})보다 부족해요. 취침 시간을 20~30분 앞당겨 보세요.`});
  else out.push({cls:"high", text:`평균 총 수면이 ${fmtDur(avgT)}으로 권장(${fmtRange(guide.total)})보다 많아요. 낮잠이 너무 길지 않은지 확인해 보세요.`});
  const sn = statusFor(avgN, guide.night);
  if(sn.cls==="low" && avgP/60>guide.nap[1]) out.push({cls:"low", text:`밤잠 평균 ${fmtDur(avgN)}이 권장(${fmtRange(guide.night)})보다 짧은데 낮잠은 긴 편이에요. 낮잠을 ${fmtRange(guide.nap)} 안으로 줄이면 밤잠이 늘 수 있어요.`});
  else if(sn.cls==="low") out.push({cls:"low", text:`밤잠 평균이 ${fmtDur(avgN)}으로 권장(${fmtRange(guide.night)})에 못 미쳐요.`});
  else if(sn.cls==="ok") out.push({cls:"ok", text:`밤잠 평균 ${fmtDur(avgN)}, 권장 범위(${fmtRange(guide.night)}) 안이에요.`});
  const sp = statusFor(avgP, guide.nap);
  if(sp.cls==="none") out.push({cls:"low", text:`낮잠 기록이 없어요. 이 시기에는 낮잠 ${guide.naps}, ${fmtRange(guide.nap)}이 권장돼요.`});
  else if(sp.cls==="ok") out.push({cls:"ok", text:`낮잠 평균 ${fmtDur(avgP)}, 권장 범위(${fmtRange(guide.nap)}) 안이에요.`});
  else if(sp.cls==="low") out.push({cls:"low", text:`낮잠 평균이 ${fmtDur(avgP)}으로 권장(${fmtRange(guide.nap)})보다 짧아요.`});
  else out.push({cls:"high", text:`낮잠 평균이 ${fmtDur(avgP)}으로 권장(${fmtRange(guide.nap)})보다 길어요. 밤잠에 영향을 줄 수 있어요.`});
  const inRange = rec.filter(d=>d.total/60>=guide.total[0] && d.total/60<=guide.total[1]).length;
  out.push({cls:"info", text:`기록한 ${rec.length}일 중 ${inRange}일이 권장 총 수면 범위 안이었어요.`});
  const ns = nightStarts(days);
  if(ns.length>=3){
    const sd=stddev(ns), avg=mean(ns);
    if(sd<=20) out.push({cls:"ok", text:`취침 시각이 평균 ${fmtClock(avg)}, 편차 ±${Math.round(sd)}분으로 매우 일정해요. 규칙적인 취침은 수면의 질을 높여요.`});
    else if(sd<=45) out.push({cls:"info", text:`취침 시각 평균 ${fmtClock(avg)}, 편차 ±${Math.round(sd)}분이에요. 대체로 규칙적이에요.`});
    else out.push({cls:"low", text:`취침 시각 편차가 ±${Math.round(sd)}분으로 들쭉날쭉해요. 매일 비슷한 시각(${guide.bed} 권장)에 재워 보세요.`});
  }
  return out;
}

/* ---------- SVG 차트 ---------- */
function chartSvg(days, guide, opts){
  const W=520, H=230, padL=38, padR=10, padT=12, padB=30;
  const iw=W-padL-padR, ih=H-padT-padB;
  const y = v => padT + ih*(1 - Math.min(v,SCALE_MAX)/SCALE_MAX);
  const n = days.length;
  const slot = iw/n, bw = Math.min(slot*(n>10?0.62:0.5), 34);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 수면 시간 차트">`;
  // 권장 범위 밴드
  const bTop=y(guide.total[1]*60), bBot=y(guide.total[0]*60);
  s += `<rect x="${padL}" y="${bTop}" width="${iw}" height="${bBot-bTop}" fill="var(--band)"/>`;
  s += `<line x1="${padL}" x2="${padL+iw}" y1="${bTop}" y2="${bTop}" stroke="var(--night)" stroke-dasharray="4 4" stroke-width="1"/>`;
  s += `<line x1="${padL}" x2="${padL+iw}" y1="${bBot}" y2="${bBot}" stroke="var(--night)" stroke-dasharray="4 4" stroke-width="1"/>`;
  // 눈금
  for(const t of [0,4,8,12,16]){
    const ty=y(t*60);
    s += `<line x1="${padL}" x2="${padL+iw}" y1="${ty}" y2="${ty}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${padL-6}" y="${ty+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t}h</text>`;
  }
  // 막대 (밤잠 아래 + 낮잠 위)
  days.forEach((d,i)=>{
    const cx = padL + slot*i + slot/2;
    const x = cx - bw/2;
    const yN = y(d.night), yT = y(d.night + d.nap);
    if(d.night>0) s += `<rect x="${x}" y="${yN}" width="${bw}" height="${y(0)-yN}" rx="2" fill="var(--night)"/>`;
    if(d.nap>0)   s += `<rect x="${x}" y="${yT}" width="${bw}" height="${yN-yT}" rx="2" fill="var(--nap)"/>`;
    if(d.total===0) s += `<circle cx="${cx}" cy="${y(0)-3}" r="1.5" fill="var(--muted)"/>`;
    // x 라벨
    let lab=null;
    const dt=new Date(d.date+"T00:00");
    if(opts.mode==="week") lab = weekdayKo[dt.getDay()];
    else if(i===0 || i===n-1 || dt.getDate()%5===0) lab = String(dt.getDate());
    if(lab!==null) s += `<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${lab}</text>`;
  });
  s += `</svg>`;
  return s;
}

/* ---------- 화면 렌더링 ---------- */
const $ = sel => document.querySelector(sel);
function gaugeHtml(name, min, rangeH, color){
  const st = statusFor(min, rangeH);
  const pct = v => Math.min(100, v/SCALE_MAX*100).toFixed(1);
  return `<div class="gauge">
    <div class="ghead"><span class="name">${name}</span>
      <span class="chip ${st.cls}">${st.label}</span>
      <span class="val">${min>0?fmtDur(min):"–"}</span></div>
    <div class="track">
      <div class="band" style="left:${pct(rangeH[0]*60)}%;width:${(pct(rangeH[1]*60)-pct(rangeH[0]*60)).toFixed(1)}%"></div>
      <div class="fill" style="width:${pct(min)}%;background:${color}"></div>
    </div>
    <div class="gnote">권장 ${fmtRange(rangeH)}</div>
  </div>`;
}
function statusTile(cls, name, ts, sub){
  return `<div class="stile ${cls}">
    <div class="sk">${name}</div>
    <div class="sv" ${ts?`data-ts="${ts}"`:""}>${ts?fmtSince(ts):"기록 없음"}</div>
    <div class="ss">${sub}</div>
  </div>`;
}
function entryRow(e){
  const meta = TYPE_META[e.type]||TYPE_META.meal;
  let detail="";
  if(e.type==="nap"||e.type==="night") detail = `~ ${e.end} · ${fmtDur(e.minutes)}`;
  else if(e.type==="diaper") detail = e.kind==="poo"?"대변":"소변";
  return `<div class="entry"><span class="etime">${e.start}</span>
    <span class="dot ${meta.dot}"></span>
    <span class="lab">${meta.label}</span>
    ${detail?`<span class="t">${detail}</span>`:""}
    <button class="del" data-del="${e.id}" aria-label="기록 삭제">✕</button></div>`;
}
function timelineHtml(){
  let dates = [...new Set(state.entries.map(e=>e.date))].sort().reverse();
  const tk = todayKey();
  if(!dates.includes(tk)) dates.unshift(tk);
  dates = dates.slice(0,7);
  let html="";
  dates.forEach(date=>{
    const st = dayStats(date);
    const list = st.entries.slice().sort((a,b)=>hm2min(b.start)-hm2min(a.start));
    const sums=[];
    if(st.night>0) sums.push(`🌙 ${fmtDur(st.night)}`);
    if(st.nap>0) sums.push(`☀️ ${fmtDur(st.nap)}`);
    html += `<div class="dayhead"><span class="d">${fmtDayHead(date)}</span>
      ${date===tk?'<span class="today-mark">오늘</span>':""}
      <span class="sum">${sums.map(s=>`<span>${s}</span>`).join("")}</span></div>`;
    html += list.length ? list.map(entryRow).join("")
      : `<div class="empty">아직 기록이 없어요. 위 버튼으로 기록해 보세요.</div>`;
  });
  return html;
}

  const days = lastDays(nDays);
  const rec = days.filter(d=>d.total>0);
  const avg = k => rec.length? mean(rec.map(d=>d[k])) : 0;
  const insights = analyze(days, guide);
  return `
  <section class="card">
    <h2>최근 ${nDays}일 수면 <small>권장 총 수면 ${fmtRange(guide.total)} 구간 표시</small></h2>
    <div class="chartbox">${chartSvg(days, guide, {mode:modeName})}</div>
    <div class="legend"><span><i style="background:var(--night)"></i>밤잠</span><span><i style="background:var(--nap)"></i>낮잠</span><span><i style="background:var(--band);border:1px dashed var(--night)"></i>권장 범위</span></div>
  </section>
  <section class="card">

      <div class="stat"><div class="k">밤잠</div><div class="v">${rec.length?fmtDur(avg("night")):"–"}</div><div class="r">권장 ${fmtRange(guide.night)}</div></div>
      <div class="stat"><div class="k">낮잠</div><div class="v">${rec.length?fmtDur(avg("nap")):"–"}</div><div class="r">권장 ${fmtRange(guide.nap)}</div></div>

  <section class="card">
    <h2>분석</h2>
    ${insights.length ? insights.map(i=>`<div class="insight ${i.cls}"><span class="mark"></span><span>${i.text}</span></div>`).join("") :
      `<div class="empty">기록이 쌓이면 수면 패턴 분석이 여기에 표시돼요.</div>`}
  </section>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", ev=>{
  if(ev.target.id==="overlay"){ closeSheet(); return; }
  const b = ev.target.closest("button");
  if(!b) return;
  if(b.dataset.tab){ state.tab=b.dataset.tab; render(); return; }
  if(b.dataset.open){ openSheet(b.dataset.open); return; }
  if(b.id==="sCancel"){ closeSheet(); return; }
  if(b.id==="kindPee"){ state.diaperKind="pee"; $("#kindPee").classList.add("on"); $("#kindPoo").classList.remove("on"); return; }
  if(b.id==="kindPoo"){ state.diaperKind="poo"; $("#kindPoo").classList.add("on"); $("#kindPee").classList.remove("on"); return; }
  if(b.dataset.del){ if(confirm("이 기록을 삭제할까요?")) removeEntry(b.dataset.del); return; }
  if(b.id==="fProfileSave"){ saveProfile($("#fBirth").value, $("#fName").value); return; }
  if(b.id==="btnExport"){ exportData(); return; }
  if(b.id==="btnImport"){ $("#impFile").click(); return; }
  if(b.id==="sSave"){
    const type = state.sheet;
    const date=$("#fDate").value, start=$("#fStart").value;
    if(!date||!start){ alert("날짜와 시각을 입력해 주세요."); return; }
    if(type==="meal"){
      saveEntry({type:"meal", date, start, minutes:0, createdAt:new Date().toISOString()});
      return;
    }
    if(type==="diaper"){
      saveEntry({type:"diaper", date, start, kind:state.diaperKind, minutes:0, createdAt:new Date().toISOString()});
      return;
    }
    const end=$("#fEnd").value;
    if(!end){ alert("깬 시각을 입력해 주세요."); return; }
    let minutes = hm2min(end)-hm2min(start);
    if(minutes<=0) minutes += 1440; // 자정 넘김
    if(minutes>=1440){ alert("수면 시간이 24시간을 넘을 수 없어요."); return; }
    saveEntry({type, date, start, end, minutes, createdAt:new Date().toISOString()});
  }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="impFile" && ev.target.files && ev.target.files[0]){
    importData(ev.target.files[0]);
    ev.target.value="";
  }
});

loadLocal();
render();
connectDb();
</script>
</body>
</html>
